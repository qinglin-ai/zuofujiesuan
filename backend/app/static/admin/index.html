<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>左辅云创 · 管理后台</title>
  <link rel="stylesheet" href="/admin/static/css/admin.css">
</head>
<body>
  <!-- 登录视图 -->
  <div id="login-view" class="login-view">
    <form id="login-form" class="login-card">
      <div class="login-head">
        <h1>左辅云创</h1>
        <p class="login-sub">兼职作业与佣金结算 · 管理后台</p>
      </div>

      <div class="login-field">
        <label for="login-account">管理员账号</label>
        <input id="login-account" name="username" type="text" placeholder="手机号或姓名" autocomplete="username" required>
      </div>

      <div class="login-field">
        <label for="login-password">密码</label>
        <input id="login-password" name="password" type="password" placeholder="请输入登录密码" autocomplete="current-password" required>
      </div>

      <p id="login-error" class="error hidden"></p>

      <button type="submit" class="login-submit">登 录</button>

      <p class="hint">
        首次登录：需先用小程序登录建档，再由运维执行
        <code>flask seed-admin</code> 初始化管理员账号密码。
      </p>
    </form>
    
  </div>

  <!-- 主面板 -->
  <div id="app-view" class="app-view hidden">
    <aside class="sidebar">
      <div class="brand">左辅云创</div>
      <nav>
        <a data-page="users" class="active">用户 / 审批</a>
        <a data-page="tasks">任务管理</a>
        <a data-page="quality">核验管理</a>
        <a data-page="certifications">能力认证</a>
        <a data-page="violations">违规管理</a>
        <a data-page="notices">公告管理</a>
        <a data-page="withdrawals">提现确认</a>
        <a data-page="ledger">台账 / 对账</a>
      </nav>
      <div class="sidebar-foot">
        <span id="admin-name"></span>
        <button id="logout-btn" class="link-btn">退出</button>
      </div>
    </aside>
    <main id="page-content" class="page-content"></main>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/admin/static/js/app.js"></script>
</body>
</html>
