# 前后端分离部署编排：MySQL + 后端服务
# 启动时 MySQL 首次将以空数据目录初始化，自动创建 zuofu_parttime 库并执行 migrations/*.sql 建表脚本。
# 用法：docker compose up -d --build   （环境变量来自根目录 .env，参考 .env.example）
# 数据库数据落在宿主 /data/zuofujiesuan/mysql（首次需先建目录并 chown 999:999）。
# 首次启动若需重置数据库，可停止容器后清空该目录再重启（仅测试环境）。

services:
  mysql:
    image: mysql:8.0
    container_name: zuofu_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: zuofu_parttime
      MYSQL_USER: zuofu_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      # 数据目录绑定到宿主路径，便于备份、迁移与直接排查；容器内 MySQL 用户 uid=999，首次需 chown 999:999
      - /data/zuofujiesuan/mysql:/var/lib/mysql
      # 首启自动执行建表脚本（含全部唯一约束/索引）
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    # 不向宿主机发布 3306：后端通过 compose 网络（mysql:3306）访问即可，
    # 既满足安全规范（数据库不对外），也避免与宿主机/旧容器上的 MySQL 端口冲突。
    # 需要图形工具连接时，用 SSH 隧道到本机后临时改为 "127.0.0.1:3306:3306"。
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: zuofu_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: "0"
      # 与上方 mysql 服务的库名/账号一致
      DB_URI: mysql+pymysql://zuofu_app:${MYSQL_APP_PASSWORD}@mysql:3306/zuofu_parttime?charset=utf8mb4
      JWT_SECRET: ${JWT_SECRET}
      WX_APPID: ${WX_APPID}
      WX_SECRET: ${WX_SECRET}
      # 微信支付 商家转账到零钱（自动打款）
      WXPAY_ENABLED: ${WXPAY_ENABLED}
      WX_MCHID: ${WX_MCHID}
      WXPAY_API_V3_KEY: ${WXPAY_API_V3_KEY}
      WXPAY_MCH_SERIAL_NO: ${WXPAY_MCH_SERIAL_NO}
      WXPAY_MCH_PRIVATE_KEY_PATH: ${WXPAY_MCH_PRIVATE_KEY_PATH:-certs/apiclient_key.pem}
      WXPAY_PLATFORM_PUBLIC_KEY_PATH: ${WXPAY_PLATFORM_PUBLIC_KEY_PATH:-certs/pub_key.pem}
      WXPAY_PLATFORM_PUBLIC_KEY_ID: ${WXPAY_PLATFORM_PUBLIC_KEY_ID}
      WXPAY_NOTIFY_URL: ${WXPAY_NOTIFY_URL}
      WXPAY_TRANSFER_SCENE_ID: ${WXPAY_TRANSFER_SCENE_ID:-1000}
      WXPAY_SCENE_REPORT_INFOS: ${WXPAY_SCENE_REPORT_INFOS}
      WXPAY_RETRY_MAX: ${WXPAY_RETRY_MAX:-1}
      WXPAY_HTTP_TIMEOUT: ${WXPAY_HTTP_TIMEOUT:-10}
      WXPAY_MOCK: ${WXPAY_MOCK:-0}
      # 提现规则：每日最多提现申请次数
      WITHDRAW_DAILY_MAX: ${WITHDRAW_DAILY_MAX:-1}
    volumes:
      - ./backend/certs:/app/certs:ro
    ports:
      # 443 上的 Nginx 跑在容器里（多项目共存的常见形态），其 vhost 通过
      # http://host.docker.internal:5001 访问后端。host.docker.internal 指向宿主的 docker 网关
      # 地址（默认 172.17.0.1，以该容器内 /etc/hosts 为准），所以这里不能绑 127.0.0.1——
      # 容器内的 127.0.0.1 是容器自身，绑回环必然 502。宿主端口用 5001 与既有 vhost 对齐。
      # 查看实际解析：docker exec <nginx容器名> sh -c 'grep host.docker.internal /etc/hosts'
      - "172.17.0.1:5001:5000"